name: Android Vulkan backend
on:
  workflow_dispatch:
  push:
    branches: [feature/optional-vulkan]
    paths: ['scripts/build_vulkan_runtime.sh', '.github/workflows/vulkan.yml']
permissions:
  contents: read
jobs:
  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VULKAN_SDK_VERSION: '1.4.357.1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - name: Build inputs
        run: |
          sdkmanager 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          curl -fL --retry 3 "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz" -o "$RUNNER_TEMP/vulkan.tar.xz"
          tar -xJf "$RUNNER_TEMP/vulkan.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk" --strip-components=1
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
      - name: Compile Android Vulkan plugin
        run: |
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash scripts/build_vulkan_runtime.sh
          readelf -d app/lib/arm64-v8a/libbonsai_vulkan.so
          readelf -lW app/lib/arm64-v8a/libbonsai_vulkan.so
      - name: Collect runtime and packaging tools
        run: |
          mkdir -p build/vulkan-artifact/tools
          cp app/lib/arm64-v8a/libbonsai_vulkan.so build/vulkan-runtime.json build/vulkan-artifact/
          cp "$ANDROID_HOME/platforms/android-35/android.jar" build/vulkan-artifact/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/vulkan-artifact/tools/
      - uses: actions/upload-artifact@v4
        with:
          name: android-vulkan-runtime
          path: build/vulkan-artifact/
          retention-days: 14
