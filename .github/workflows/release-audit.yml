name: Release source and license audit
on:
  push:
    paths: ['.github/workflows/release-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve current staging for verification
        run: |
          mkdir -p audit
          if [ -d .bootstrap ]; then cp -a .bootstrap audit/bootstrap; fi
      - name: Fetch pinned upstream source and license metadata
        run: |
          curl -fL --retry 3 https://github.com/PrismML-Eng/llama.cpp/archive/9a9394a895b96003ca842a6041cb28ac49a108f7.tar.gz -o /tmp/prism-source.tar.gz
          mkdir /tmp/prism-source
          tar xzf /tmp/prism-source.tar.gz -C /tmp/prism-source --strip-components=1
          python3 - <<'PY'
          import pathlib, shutil, urllib.request
          src=pathlib.Path('/tmp/prism-source'); dst=pathlib.Path('audit/upstream')
          extra={'stb_image.h','miniaudio.h','subprocess.h','package.json','package-lock.json'}
          for p in src.rglob('*'):
              if not p.is_file():continue
              wanted=any(x in p.name.lower() for x in ('license','copying','notice')) or p.name in extra
              if p.suffix=='.cmake' or p.name=='CMakeLists.txt':
                  if 'boringssl' in p.read_text(errors='ignore').lower():wanted=True
              if wanted and p.suffix.lower() not in ('.ttf','.otf','.woff','.woff2'):
                  q=dst/p.relative_to(src);q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
          model=pathlib.Path('audit/model');model.mkdir(parents=True,exist_ok=True)
          for name in ['LICENSE','NOTICE.txt','README.md']:
              u='https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/raw/6ed5e12bf84b7a63069882c91dd9e9218647d17b/'+name
              with urllib.request.urlopen(u,timeout=40) as r:(model/name).write_bytes(r.read())
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Collect web UI license texts without running package scripts
        run: |
          cd /tmp/prism-source/tools/ui
          npm ci --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import pathlib, json, shutil
          src=pathlib.Path('/tmp/prism-source/tools/ui');dst=pathlib.Path('audit/ui-dependencies');dst.mkdir(parents=True,exist_ok=True)
          rows=[]
          lock=json.loads((src/'package-lock.json').read_text())
          for rel,locked in sorted(lock['packages'].items()):
              if not rel:continue
              p=src/rel/'package.json'
              if not p.exists():continue
              data=json.loads(p.read_text());name=data.get('name');version=data.get('version')
              if not name or not version:continue
              key=name.replace('/','__')+'@'+str(version);target=dst/key;found=[]
              for f in p.parent.iterdir():
                  if f.is_file() and any(x in f.name.lower() for x in ('license','copying','notice')):
                      target.mkdir(parents=True,exist_ok=True);shutil.copy2(f,target/f.name);found.append(f.name)
              rows.append({'name':name,'version':version,'license':data.get('license'),'files':found,'path':rel})
          (dst/'inventory.json').write_text(json.dumps(rows,indent=2))
          print('License inventory entries:',len(rows))
          PY
      - name: Archive auditable source metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-audit
          path: audit
          include-hidden-files: true
          retention-days: 3
