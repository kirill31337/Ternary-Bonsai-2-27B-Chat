name: Nested dependency notices
on:
  push:
    paths: ['.github/workflows/nested-notices.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Collect license texts only
        run: |
          curl -fL --retry 3 https://github.com/PrismML-Eng/llama.cpp/archive/9a9394a895b96003ca842a6041cb28ac49a108f7.tar.gz -o /tmp/src.tar.gz
          mkdir /tmp/prism
          tar xzf /tmp/src.tar.gz -C /tmp/prism --strip-components=1
          cd /tmp/prism/tools/ui
          npm ci --ignore-scripts --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          src=Path('/tmp/prism/tools/ui/node_modules');dst=Path('nested-notices');dst.mkdir()
          rows=[]
          for p in sorted(src.rglob('*')):
              if not p.is_file() or p.is_symlink():continue
              name=p.name.lower()
              if not any(w in name for w in ('license','copying','copyright','notice','ofl')):continue
              if p.suffix.lower() not in ('','.txt','.md','.markdown'):continue
              rel=p.relative_to(src);q=dst/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
              rows.append({'path':str(rel),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (dst/'inventory.json').write_text(json.dumps(rows,indent=2));print('Notice files:',len(rows))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nested-notices
          path: nested-notices
          retention-days: 3
