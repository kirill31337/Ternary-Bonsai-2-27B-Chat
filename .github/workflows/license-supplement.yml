name: License supplement
on:
  push:
    paths: ['.github/workflows/license-supplement.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch licenses and source metadata
        run: |
          mkdir -p audit-extra
          python3 - <<'PY'
          import urllib.request,pathlib,json
          root=pathlib.Path('audit-extra'); records=[]
          items={
          'BoringSSL-LICENSE.txt':'https://raw.githubusercontent.com/google/boringssl/0.20260813.0/LICENSE',
          'OpenJDK-LICENSE.txt':'https://raw.githubusercontent.com/openjdk/jdk21u/jdk-21.0.8-ga/LICENSE',
          'LLVM-libcxx-LICENSE.txt':'https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-21.1.0/libcxx/LICENSE.TXT',
          'LLVM-libcxxabi-LICENSE.txt':'https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-21.1.0/libcxxabi/LICENSE.TXT',
          'LLVM-compiler-rt-LICENSE.txt':'https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-21.1.0/compiler-rt/LICENSE.TXT',
          'remark-math-LICENSE.txt':'https://raw.githubusercontent.com/remarkjs/remark-math/main/license',
          'is-reference-LICENSE.txt':'https://raw.githubusercontent.com/Rich-Harris/is-reference/master/LICENSE',
          'locate-character-LICENSE.txt':'https://raw.githubusercontent.com/Rich-Harris/locate-character/master/LICENSE',
          'prism-svelte-LICENSE.txt':'https://raw.githubusercontent.com/ernestognw/prism-svelte/master/LICENSE'
          }
          for name,url in items.items():
              try:
                  with urllib.request.urlopen(url,timeout=30) as r: data=r.read()
                  (root/name).write_bytes(data);records.append({'file':name,'source':url,'status':'downloaded'})
              except Exception as e:records.append({'file':name,'source':url,'error':str(e)})
          (root/'sources.json').write_text(json.dumps(records,indent=2));print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: license-supplement
          path: audit-extra
          retention-days: 3
