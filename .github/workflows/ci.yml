name: Android client checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - name: Install build inputs
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 -m pip install -r requirements-dev.txt
          mkdir -p build
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o build/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  build/apktool.jar' | sha256sum -c -
          bash scripts/fetch_prism_runtime.sh
      - name: Create disposable CI signing key
        run: |
          bash scripts/create_test_keystore.sh "$RUNNER_TEMP/ci-test.jks"
      - name: Build and verify
        env:
          APKTOOL_JAR: ${{ github.workspace }}/build/apktool.jar
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
          ANDROID_TOOLS_JAR: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/d8.jar:${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          SIGNING_KEYSTORE: ${{ runner.temp }}/ci-test.jks
          SIGNING_ALIAS: bonsai-ci-test
          SIGNING_STOREPASS: android
          SIGNING_KEYPASS: android
        run: |
          bash build_apk.sh
          TEST_APK=build/BonsaiLocal-1.1.2-arm64.apk bash tests/run_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BonsaiLocal-1.1.2-ci-arm64
          path: build/BonsaiLocal-1.1.2-arm64.apk
          retention-days: 14
