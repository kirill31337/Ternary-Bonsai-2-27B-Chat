name: Inspect staged source
on:
  push:
    paths: ['.bootstrap/INSPECT']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/min* | base64 -d > /tmp/source.tar.gz
          sha256sum /tmp/source.tar.gz
          echo "=== archive ==="
          tar tzf /tmp/source.tar.gz | sed -n '1,240p'
          echo "=== count ==="
          tar tzf /tmp/source.tar.gz | wc -l
