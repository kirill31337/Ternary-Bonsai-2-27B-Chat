name: Publish final source tree
on:
  push:
    paths:
      - '.bootstrap/final/READY'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and publish staged source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final/src.b64.* .bootstrap/final/tail.* .bootstrap/final/rem2.* | base64 -d > "$RUNNER_TEMP/source.tar.gz"
          gzip -t "$RUNNER_TEMP/source.tar.gz"
          mkdir "$RUNNER_TEMP/source"
          tar xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/README.md"
          test -d "$RUNNER_TEMP/source/app"
          test -d "$RUNNER_TEMP/source/tests"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Bonsai Local 1.0 source'
          git push
