name: Publish final source tree
on:
  push:
    paths:
      - '.bootstrap/final/READY'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and expand staged source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/final/src.b64.* | base64 -d > "$RUNNER_TEMP/source.tar.gz"
          echo 'b87c75553c29ee6fd6853ec2850b532a3462ec8daa3273036a42fc1d570bedce  '"$RUNNER_TEMP"'/source.tar.gz' | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Bonsai Local 1.0 source'
          git push
