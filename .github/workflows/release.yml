name: Release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.1'
        required: true
        default: 'v1.2.1'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'
      - name: Check signing secrets
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          STOREPASS: ${{ secrets.ANDROID_SIGNING_STOREPASS }}
          KEYPASS: ${{ secrets.ANDROID_SIGNING_KEYPASS }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        run: |
          test -n "$KEY_B64" && test -n "$STOREPASS" && test -n "$KEYPASS" && test -n "$ALIAS"
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build inputs
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          python3 -m pip install -r requirements-dev.txt
          mkdir -p build
          curl -fL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o build/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  build/apktool.jar' | sha256sum -c -
          bash scripts/fetch_prism_runtime.sh
          export ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export VULKAN_SDK_VERSION=1.4.357.1
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          curl -fL --retry 3 "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz" -o "$RUNNER_TEMP/vulkan.tar.xz"
          tar -xJf "$RUNNER_TEMP/vulkan.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk" --strip-components=1
          export VULKAN_SDK="$RUNNER_TEMP/vulkan-sdk/x86_64"
          export LD_LIBRARY_PATH="$VULKAN_SDK/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash scripts/build_vulkan_runtime.sh
      - name: Build signed APK
        env:
          APKTOOL_JAR: ${{ github.workspace }}/build/apktool.jar
          ANDROID_JAR: ${{ env.ANDROID_HOME }}/platforms/android-35/android.jar
          ANDROID_TOOLS_JAR: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/d8.jar:${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          SIGNING_STOREPASS: ${{ secrets.ANDROID_SIGNING_STOREPASS }}
          SIGNING_KEYPASS: ${{ secrets.ANDROID_SIGNING_KEYPASS }}
        run: |
          bash build_apk.sh
          TEST_APK=build/BonsaiLocal-1.2.1-arm64.apk bash tests/run_all.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum build/BonsaiLocal-1.2.1-arm64.apk > build/BonsaiLocal-1.2.1-arm64.apk.sha256
          gh release create '${{ inputs.tag }}' build/BonsaiLocal-1.2.1-arm64.apk build/BonsaiLocal-1.2.1-arm64.apk.sha256 --title 'Bonsai Local 1.2.1' --notes-file RELEASE_NOTES.md
